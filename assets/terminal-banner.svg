<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff9c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#glow)"/>

  <!-- terminal window chrome -->
  <rect x="20" y="20" width="1160" height="240" rx="10" fill="#0a0a0a" stroke="#1a3a2c" stroke-width="1.5"/>
  <circle cx="45" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="85" cy="42" r="6" fill="#27c93f"/>
  <text x="600" y="47" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#4a4a4a">shubham@ai-engineer: ~</text>
  <line x1="20" y1="60" x2="1180" y2="60" stroke="#1a3a2c" stroke-width="1"/>

  <!-- grid pattern, faint -->
  <g stroke="#0f2a20" stroke-width="1" opacity="0.5">
    <line x1="20" y1="100" x2="1180" y2="100"/>
    <line x1="20" y1="140" x2="1180" y2="140"/>
    <line x1="20" y1="180" x2="1180" y2="180"/>
    <line x1="20" y1="220" x2="1180" y2="220"/>
  </g>

  <!-- terminal text lines -->
  <text x="50" y="95" font-family="Courier New, monospace" font-size="18" fill="#00ff9c">$ python train.py --model=shubham_engineer</text>
  <text x="50" y="130" font-family="Courier New, monospace" font-size="16" fill="#7fffca">Loading dataset: curiosity.csv ... done</text>
  <text x="50" y="160" font-family="Courier New, monospace" font-size="16" fill="#7fffca">Epoch 2027/∞ — loss decreasing, skills increasing</text>
  <text x="50" y="190" font-family="Courier New, monospace" font-size="16" fill="#c9ffe6">Model status: <tspan fill="#00ff9c">READY TO DEPLOY</tspan></text>

  <!-- cursor blink -->
  <rect x="53" y="200" width="10" height="18" fill="#00ff9c">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- right side: neural net mini graphic -->
  <g transform="translate(950,90)">
    <g stroke="#1fb67d" stroke-opacity="0.6" stroke-width="1.2">
      <line x1="0" y1="10" x2="60" y2="0"/>
      <line x1="0" y1="10" x2="60" y2="35"/>
      <line x1="0" y1="10" x2="60" y2="70"/>
      <line x1="0" y1="55" x2="60" y2="0"/>
      <line x1="0" y1="55" x2="60" y2="35"/>
      <line x1="0" y1="55" x2="60" y2="70"/>
      <line x1="0" y1="100" x2="60" y2="0"/>
      <line x1="0" y1="100" x2="60" y2="35"/>
      <line x1="0" y1="100" x2="60" y2="70"/>
      <line x1="60" y1="0" x2="120" y2="35"/>
      <line x1="60" y1="35" x2="120" y2="35"/>
      <line x1="60" y1="70" x2="120" y2="35"/>
    </g>
    <g fill="#00ff9c">
      <circle cx="0" cy="10" r="4"/>
      <circle cx="0" cy="55" r="4"/>
      <circle cx="0" cy="100" r="4"/>
      <circle cx="60" cy="0" r="4"/>
      <circle cx="60" cy="35" r="4"/>
      <circle cx="60" cy="70" r="4"/>
      <circle cx="120" cy="35" r="5"/>
    </g>
  </g>

  <text x="600" y="250" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#3a6a54">AI/ML ENGINEER · PYTHON · MACHINE LEARNING · NLP · GENERATIVE AI</text>
</svg>
