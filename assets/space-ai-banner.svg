<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#0d1b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a2a6d"/>
      <stop offset="60%" stop-color="#1b1140"/>
      <stop offset="100%" stop-color="#0a0620"/>
    </radialGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ff2ff"/>
      <stop offset="100%" stop-color="#0b3d5c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4" opacity="0.9"/>
    <circle cx="140" cy="90" r="1" opacity="0.7"/>
    <circle cx="220" cy="30" r="1.6" opacity="0.8"/>
    <circle cx="310" cy="120" r="1" opacity="0.6"/>
    <circle cx="400" cy="55" r="1.3" opacity="0.9"/>
    <circle cx="480" cy="20" r="1" opacity="0.5"/>
    <circle cx="560" cy="100" r="1.5" opacity="0.8"/>
    <circle cx="650" cy="35" r="1" opacity="0.6"/>
    <circle cx="740" cy="70" r="1.4" opacity="0.9"/>
    <circle cx="820" cy="25" r="1" opacity="0.6"/>
    <circle cx="900" cy="110" r="1.6" opacity="0.8"/>
    <circle cx="980" cy="45" r="1" opacity="0.7"/>
    <circle cx="1060" cy="85" r="1.3" opacity="0.9"/>
    <circle cx="1140" cy="30" r="1" opacity="0.6"/>
    <circle cx="90" cy="220" r="1" opacity="0.5"/>
    <circle cx="260" cy="250" r="1.3" opacity="0.7"/>
    <circle cx="500" cy="230" r="1" opacity="0.6"/>
    <circle cx="700" cy="260" r="1.4" opacity="0.8"/>
    <circle cx="1000" cy="240" r="1" opacity="0.6"/>
    <circle cx="1120" cy="200" r="1.2" opacity="0.7"/>
  </g>

  <!-- distant planet -->
  <circle cx="1030" cy="70" r="55" fill="url(#planet)"/>
  <ellipse cx="1030" cy="70" rx="80" ry="12" fill="none" stroke="#3fd6ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- neural network lines (right side, background) -->
  <g stroke="#1fb6d6" stroke-opacity="0.35" stroke-width="1">
    <line x1="780" y1="60" x2="860" y2="110"/>
    <line x1="780" y1="60" x2="850" y2="40"/>
    <line x1="860" y1="110" x2="930" y2="90"/>
    <line x1="850" y1="40" x2="930" y2="90"/>
    <line x1="850" y1="40" x2="900" y2="140"/>
    <line x1="930" y1="90" x2="990" y2="60"/>
  </g>
  <g fill="#3fe0ff">
    <circle cx="780" cy="60" r="3"/>
    <circle cx="850" cy="40" r="3"/>
    <circle cx="860" cy="110" r="3"/>
    <circle cx="930" cy="90" r="3"/>
    <circle cx="900" cy="140" r="3"/>
    <circle cx="990" cy="60" r="3"/>
  </g>

  <!-- glow behind astronaut -->
  <circle cx="230" cy="165" r="150" fill="url(#glow)"/>

  <!-- astronaut -->
  <g transform="translate(140,80)">
    <!-- backpack -->
    <rect x="30" y="70" width="30" height="70" rx="8" fill="#12203f" stroke="#2a4a7a" stroke-width="2"/>
    <!-- body suit -->
    <ellipse cx="60" cy="130" rx="42" ry="55" fill="#e8edf5"/>
    <ellipse cx="60" cy="130" rx="42" ry="55" fill="none" stroke="#a9b7cf" stroke-width="2"/>
    <!-- chest panel -->
    <rect x="42" y="115" width="36" height="24" rx="4" fill="#0d1b3a" stroke="#3fe0ff" stroke-width="1.5"/>
    <circle cx="52" cy="127" r="3" fill="#3fe0ff"/>
    <circle cx="62" cy="127" r="3" fill="#ff6b9d"/>
    <circle cx="72" cy="127" r="3" fill="#ffd166"/>
    <!-- arms -->
    <ellipse cx="12" cy="115" rx="14" ry="30" fill="#e8edf5" stroke="#a9b7cf" stroke-width="2"/>
    <ellipse cx="108" cy="120" rx="14" ry="32" fill="#e8edf5" stroke="#a9b7cf" stroke-width="2"/>
    <!-- helmet -->
    <circle cx="60" cy="55" r="42" fill="#e8edf5" stroke="#a9b7cf" stroke-width="2"/>
    <circle cx="63" cy="55" r="32" fill="url(#visor)"/>
    <circle cx="50" cy="45" r="8" fill="#ffffff" opacity="0.5"/>
    <!-- holographic AI interface projecting from wrist -->
    <g transform="translate(108,150)">
      <circle cx="0" cy="0" r="3" fill="#3fe0ff"/>
      <path d="M0,0 L60,-40" stroke="#3fe0ff" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
      <circle cx="60" cy="-40" r="34" fill="none" stroke="#3fe0ff" stroke-width="1.5" opacity="0.8"/>
      <circle cx="60" cy="-40" r="22" fill="none" stroke="#3fe0ff" stroke-width="1" opacity="0.5"/>
      <g stroke="#3fe0ff" stroke-width="1" opacity="0.7">
        <line x1="40" y1="-52" x2="80" y2="-28"/>
        <line x1="80" y1="-52" x2="40" y2="-28"/>
        <line x1="60" y1="-62" x2="60" y2="-18"/>
      </g>
      <g fill="#8ff0ff">
        <circle cx="40" cy="-52" r="2"/>
        <circle cx="80" cy="-52" r="2"/>
        <circle cx="40" cy="-28" r="2"/>
        <circle cx="80" cy="-28" r="2"/>
        <circle cx="60" cy="-62" r="2"/>
        <circle cx="60" cy="-18" r="2"/>
      </g>
    </g>
  </g>

  <!-- title text, minimal -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f6ff" letter-spacing="4">SHUBHAM LONDHE</text>
  <text x="600" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#4fd6f0" letter-spacing="3">AI ENGINEER  ·  PYTHON  ·  MACHINE LEARNING  ·  GENERATIVE AI  ·  NLP</text>

  <!-- faint horizon line -->
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#12203f" stroke-width="1" opacity="0.6"/>
</svg>
